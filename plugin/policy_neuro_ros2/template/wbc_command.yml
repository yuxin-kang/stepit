# 22D command: [vx, vy, wz, base_height, left_pose_9d, right_pose_9d].
# A hand without a new target is encoded as nine NaNs; the last valid target is held.
wbc_command_subscriber:
  topic: "/wbc_command"
  topic_type: "std_msgs/msg/Float32MultiArray"
  qos:
    reliability: "best_effort"
    durability: "volatile"
    history: "keep_last"
  timeout_threshold: 0.25
  neutral_height: 0.8
  min_height: 0.3
  max_height: 0.8
  # External commands are held at the safe default until the operator presses
  # LB+A (L1+A on the Unitree remote) after enabling the policy with LT+B.
  default_enabled: false
  # Required pelvis/base-frame targets: position xyz, tangent xyz, normal xyz.
  # Replace with checkpoint-aligned valid hand targets before use.
  default_left_pose: []
  default_right_pose: []

# Optional training-compatible joystick bridge. The policy starts in this mode
# when enabled. L1+A switches between this mode and the external 22D command;
# the bridge WBC preview uses a separate topic to avoid feeding back into the
# external command subscriber.
# X switches left/right hand; D-pad vertical changes height in locomotion mode
# and pitch in arm mode.
teleop:
  enabled: true
  joystick_deadzone: 0.1
  timeout_threshold: 0.25
  velocity_x_range: [-0.5, 1.5]
  velocity_y_range: [-0.5, 0.5]
  yaw_rate_range: [-1.5, 1.5]
  height_increment: 0.02
  position_rate: 0.25
  rotation_rate: 1.0
  height_velocity_scaling:
    enabled: true
    min_height: 0.4
    full_speed_height: 0.75
    xy_min_scale: 0.2
    yaw_min_scale: 0.5
    power: 2.0
  packet_publisher:
    topic: "teleop_command"
    topic_type: "std_msgs/msg/Float32MultiArray"
    qos: {reliability: "best_effort", durability: "volatile", history: "keep_last"}
  wbc_publisher:
    topic: "teleop_wbc_command"
    topic_type: "std_msgs/msg/Float32MultiArray"
    qos: {reliability: "best_effort", durability: "volatile", history: "keep_last"}
