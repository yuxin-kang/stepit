# Raw ROS2 depth image -> four processed policy frames.
# The trained policy expects 4 x 18 x 32, oldest to newest.
depth_subscriber:
  topic: "/depth_camera"
  topic_type: "sensor_msgs/msg/Image"
  qos:
    reliability: "best_effort"
    durability: "volatile"
    history: "keep_last"
  raw_height: 36
  raw_width: 64
  crop_top: 18
  crop_bottom: 0
  crop_left: 16
  crop_right: 16
  min_depth: 0.0
  max_depth: 2.5
  gaussian_blur_kernel_size: 1
  gaussian_blur_sigma: 1.0
  timeout_threshold: 0.5
